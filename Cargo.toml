[package]
name = "claude-bus"
version = "0.1.2"
edition = "2024"

[workspace]
members = ["."]

[lib]
name = "claude_bus"
path = "src/lib.rs"

[[bin]]
name = "claude-bus"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.0"
chrono = "0.4.45"
futures-util = "0.3.33"
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "net", "sync", "time"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
