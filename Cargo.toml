[package]
name = "claude-bus"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["."]
exclude = ["poc/probe", "poc/rust-probe", "poc/round-trip"]

[lib]
name = "claude_bus"
path = "src/lib.rs"

[[bin]]
name = "claude-bus"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "net", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
