[package]
name = "claude-bus"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["."]
exclude = ["poc/probe", "poc/rust-probe", "poc/round-trip"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "net", "sync", "time"] }
