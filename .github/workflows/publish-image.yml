name: publish-image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# main-push and tag-push are different refs and can run concurrently.
# They write genuinely disjoint tag sets, but ONLY because of the
# enable={{is_default_branch}} on the sha rule below: main writes sha-<short>,
# the tag writes the version tags. Without that flag both runs emit sha-<short>
# and it silently lands on whichever finished last.
# The two runs still build the same commit twice, so sha-<short> and X.Y.Z are
# different digests of identical source. That is expected — verify a release by
# comparing the three version tags to each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # No raw latest rule: flavor latest=auto already tags latest on
          # non-prerelease semver tags. Having both makes latest bounce.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
