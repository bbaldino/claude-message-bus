name: publish-image

# Tags only. Building on main too meant a release built the same commit twice —
# once on the main push, once on the tag — and the two runs raced to write
# sha-<short>, landing on whichever finished last. Now one build per release
# emits all four tags from one digest, so every tag has a single writer and
# sha-<short> and X.Y.Z are the same bytes.
#
# The cost is that unreleased commits get no image. release_commits already
# limits releases to feat/fix, so that is docs/ci/chore commits — deliberately
# accepted, not an oversight.
#
# The test gate is unaffected: release-plz.yml still fires on every main push
# with `needs: test`, so main is still tested on every push. This workflow just
# no longer runs there.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # No raw latest rule: flavor latest=auto already tags latest on
          # non-prerelease semver tags. Having both makes latest bounce.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
