name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize runs so a post-merge run cannot race the run that spawned it.
# cancel-in-progress MUST be false — cancelling mid-release can interrupt tag
# creation.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the release on the same suite publish-image.yml runs. Without this a red
  # main still opens and auto-merges the release PR, cutting a tag and a GitHub
  # Release for a version that has no image.
  test:
    uses: ./.github/workflows/test.yml

  release-plz:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # release-plz needs full history
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # `release` runs FIRST — this ordering is load-bearing, see below.
      # @v0.5, NOT @v0 — there is no moving v0 tag; `@v0` hard-fails the run.
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # NOT secrets.GITHUB_TOKEN: tags pushed with it do not trigger
          # publish-image.yml, so the release would silently produce no image.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}

      - id: release_pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}

      # Deliberately NO `if:`. Gating on `prs_created` looks right and is the
      # bug: it is true only when the PR is CREATED, never when an existing one
      # is updated. So the first merge that fails for any reason — a transient
      # API error is enough — leaves the PR open, and every later push updates
      # it instead of creating it, skipping this step forever. Green runs, an
      # open release PR, no tag, no image, and nothing reporting a problem.
      #
      # Finding the PR by title instead makes the step idempotent: it retries on
      # the next push rather than giving up silently.
      - name: Auto-merge the release PR
        env:
          # Must be RELEASE_BOT_TOKEN: a merge by GITHUB_TOKEN does not trigger
          # the follow-up run that cuts the tag.
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          # `map(select(...))` not `.[0]`: an unrelated open PR would otherwise
          # be first in the list and get squash-merged by a release workflow.
          # `// empty` not a bare `.number`: "no PR" would yield literal `null`,
          # which then gets handed to `gh pr merge` as a PR number.
          # `--repo` is redundant here (release-plz checks out) but keeps this
          # identical to the release-please form, which has no checkout and
          # fails without it.
          pr=$(gh pr list --repo "${{ github.repository }}" --state open --json number,title \
                --jq 'map(select(.title | test("^chore(\\(.+\\))?: release "))) | .[0].number // empty')
          if [ -z "$pr" ]; then echo "no open release PR"; exit 0; fi
          gh pr merge --squash --delete-branch --repo "${{ github.repository }}" "$pr"
